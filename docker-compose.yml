services:
  ocr-service:
    build: ./ocr-service
    container_name: ocr-service
    ports:
      - "8000:8000" # En VPS usa "127.0.0.1:8002:8000" para no chocar con mmo:8000
    networks:
      - facturdor-net
      - automation_default # para n8n local (automation/n8n). En VPS es n8n_default
    restart: unless-stopped

networks:
  facturdor-net:
    driver: bridge
  automation_default:
    external: true
    name: automation_default
    # En VPS la red es n8n_default, no automation_default.
    # Si deployás en VPS, cambiá arriba a n8n_default o usá:
    # docker network connect facturdor-net n8n_n8n_1
